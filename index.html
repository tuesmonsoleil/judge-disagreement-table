<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>待裁決 21 項</title>
<style>
:root{--bg:#f6f7f9;--fg:#1c2330;--mute:#5d6778;--line:#d9dee6;--card:#fff;--gem:#1f6fb5;--hum:#b5541f;--ok:#1a7f4b}
@media(prefers-color-scheme:dark){:root{--bg:#14181f;--fg:#e6e9ef;--mute:#98a2b3;--line:#2c3441;--card:#1b212b;--gem:#6fb1ee;--hum:#f0a070;--ok:#5fcf93;color-scheme:dark}}
body{background:var(--bg);color:var(--fg);font:14px/1.6 system-ui,"Microsoft JhengHei",sans-serif;margin:0;padding:20px max(16px,env(safe-area-inset-left,0px))}
main{max-width:1000px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
h1{font-size:1.4rem;margin:0}a{color:var(--gem)}
.bar{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.card{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:12px;display:grid;grid-template-columns:minmax(0,360px) minmax(0,1fr);gap:14px}
@media(max-width:700px){.card{grid-template-columns:1fr}}
video{width:100%;border-radius:6px;background:#000}
.t{font-weight:600}.f{color:var(--mute)}
.kv{display:grid;grid-template-columns:7em 1fr;gap:2px 8px;margin:6px 0}.kv b{color:var(--mute);font-weight:500}
.g{color:var(--gem)}.h{color:var(--hum)}
.opts{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.o{border:1px solid var(--line);background:transparent;color:var(--fg);border-radius:6px;padding:4px 10px;cursor:pointer;font:inherit;max-width:100%;overflow-wrap:anywhere;text-align:left}
.o.on{background:var(--ok);color:#fff;border-color:var(--ok)}
input.free{width:100%;box-sizing:border-box;margin-top:6px;padding:5px 8px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--fg);font:inherit}
.done{border-color:var(--ok)}
</style></head><body><main>
<div class="bar"><h1>待裁決 21 項</h1><button class="o" id="exp">複製我的決定（JSON）</button><span id="prog" class="f"></span></div>
<p class="f">評審兩次結果不一致。看片段後在「我最後決定」選一個，或直接輸入；決定只存在這個瀏覽器，換裝置不會同步；完成後按「複製我的決定」貼給我。</p>
<div id="list" style="display:flex;flex-direction:column;gap:14px"></div></main>
<script>
var D=[
["W12","agents_present","drawn_human,human","同右","anim_human, anim_creature","anim_human, anim_creature","人工","[\"drawn_human\", \"human\"]","Gemini"],
["W20","agents_present","drawn_human,human","amin_human","anim_human","human","Gemini","human","人工"],
["W22","agents_present","drawn_human,human","amin_human","anim_human","human","人工","human","Gemini"],
["W25","agents_present","drawn_human,human","amin_human","anim_human","human","Gemini","human","人工"],
["W28","agents_present","drawn_human,human","amin_human","anim_human","human","Gemini","human","人工"],
["W19","audio_regime","ambient_sfx","同右","music, bark, sigh, ambient_sfx","music","人工","ambient_sfx","Gemini"],
["W20","audio_regime","dialogue","同右","dialogue, music, 哈欠†","dialogue, music","人工","dialogue","Gemini"],
["W21","foreground_source","speech","同右","music, dialogue, ambient_sfx, creature_murmur","speech","Gemini","dialogue","人工"],
["W21","music_role","none","同右","劇情張力†","score","人工","none","Gemini"],
["W20","n_humans_visible","3+","同右","4.0","4","人工","3+","Gemini"],
["W28","n_humans_visible","3+","同右","4.0","4.0","人工","3+","Gemini"],
["W21","social_interaction","0.0","同右","5.0","5.0","人工","0.0","Gemini"],
["W28","social_interaction","8.0","同右","7.0","8.0","Gemini","7.0","人工"],
["W09","speaker_visibility","off_screen","同右","on_screen","on_screen","人工","off_screen","Gemini"],
["W21","speaker_visibility","no_speech","同右","yes","on_screen","人工","no_speech","Gemini"],
["W21","speech_language","none","同右","not en","en","人工","none","Gemini"],
["W09","valence","4.0","同右","5.0","5.0","人工","4.0","Gemini"],
["W14","foreground_source","speech","ambient, music, speech","ambient_sfx, music, speech","ambient, music, speech","人工","speech","Gemini"],
["W16","foreground_source","vehicle_machine","同右","machine, music","vehicle_machine","Gemini","machine, music","人工"],
["W11","location_change","yes","同右","no","yes","Gemini","no","人工"],
["W03","social_interaction","7.5","同右","7.0","7.5","Gemini","7.0","人工"]];
var DEC={},CL=['W03', 'W09', 'W11', 'W12', 'W14', 'W16', 'W19', 'W20', 'W21', 'W22', 'W25', 'W28'],M={'W03': 'W03_dme.mp4', 'W09': 'W09_dme.mp4', 'W11': 'W11_dme.mp4', 'W12': 'W12_dmh.mp4', 'W14': 'W14_dmh.mp4', 'W16': 'W16_dmh.mp4', 'W19': 'W19_tp.mp4', 'W20': 'W20_dme.mp4', 'W21': 'W21_dmh.mp4', 'W22': 'W22_dme.mp4', 'W25': 'W25_dmh.mp4', 'W28': 'W28_dme.mp4'};try{DEC=JSON.parse(localStorage.getItem('dec')||'{}')}catch(e){}
function esc(s){var d=document.createElement("div");d.textContent=s;return d.innerHTML}
function key(r,i){return r[0]+"|"+r[1]}
function opts(r){var o=[["Gemini："+r[2],r[2]]];var hv=r[4];o.push(["人工校正："+hv,hv]);
 if(r[5]!==r[2]&&r[5]!==hv)o.push(["第1次評審值："+r[5],r[5]]);if(r[7]!==r[2]&&r[7]!==hv&&r[7]!==r[5])o.push(["第2次評審值："+r[7],r[7]]);return o}
function save(k,v){DEC[k]={final:v};try{localStorage.setItem("dec",JSON.stringify(DEC))}catch(e){}draw()}
document.addEventListener("click",function(e){if(e.target.id==="exp"){var t=JSON.stringify(DEC,null,1);navigator.clipboard.writeText(t).then(function(){e.target.textContent="已複製"},function(){prompt("",t)})}});
function draw(){var L=document.getElementById("list"),n=0;L.innerHTML="";
 D.forEach(function(r,i){var k=key(r),cur=(DEC[k]||{}).final;if(cur)n++;
  var c=document.createElement("div");c.className="card"+(cur?" done":"");
  var vid=CL.indexOf(r[0])>=0?'<video controls preload="metadata" src="clips/'+M[r[0]]+'"></video>':'<div class="f">（找不到片段）</div>';
  c.innerHTML='<div>'+vid+'</div><div><div class="t">'+r[0]+' · '+r[1]+'</div><div class="kv"><b>Gemini</b><span class="g">'+esc(r[2])+'</span><b>人工原文</b><span>'+esc(r[3])+'</span><b>人工校正</b><span class="h">'+esc(r[4])+'</span><b>第1次評審</b><span>'+esc(r[5])+' → '+r[6]+'勝</span><b>第2次評審</b><span>'+esc(r[7])+' → '+r[8]+'勝</span></div><div class="t">我最後決定</div><div class="opts"></div><input class="free" placeholder="或直接輸入其他答案">';
  var ob=c.querySelector(".opts");
  opts(r).forEach(function(p){var b=document.createElement("button");b.className="o"+(cur===p[1]?" on":"");b.textContent=p[0];b.onclick=function(){save(k,p[1])};ob.appendChild(b)});
  var inp=c.querySelector("input");if(cur&&!opts(r).some(function(p){return p[1]===cur}))inp.value=cur;
  inp.onchange=function(){if(inp.value.trim())save(k,inp.value.trim())};
  L.appendChild(c)});
 document.getElementById("prog").textContent="已決定 "+n+" / "+D.length}
draw();
</script></body></html>
