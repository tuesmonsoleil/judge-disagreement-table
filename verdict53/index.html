<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>v5.3 評審不一致確認</title>
<style>
:root{--bg:#f6f7f9;--fg:#1c2330;--mute:#5d6778;--line:#d9dee6;--card:#fff;--g:#1f6fb5;--h:#b5541f}
@media (prefers-color-scheme:dark){:root{--bg:#14181f;--fg:#e6e9ef;--mute:#98a2b3;--line:#2c3441;--card:#1b212b;--g:#6fb1ee;--h:#f0a070;color-scheme:dark}}
body{background:var(--bg);color:var(--fg);font-family:"Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif;margin:0;padding:24px max(16px,env(safe-area-inset-left))}
main{max-width:900px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
.c{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:14px;display:flex;flex-direction:column;gap:8px}
video{width:100%;max-width:560px;border-radius:6px}
.g{color:var(--g)}.h{color:var(--h)} .m{color:var(--mute);font-size:.9rem}

</style></head><body><main>
<h1>v5.3 評審不一致確認（13 窗 → 4 項）</h1>
<p class="m">Gemini 評審同一欄判兩次結果不同。看片段後選「人工」「Gemini」或自填最後決定，再按最下方複製答案。</p>
<div id="L"></div>
<button id="ex">複製全部答案（JSON）</button><textarea id="out" readonly></textarea>
</main><script>
var D=[{"wid": "bourne_p2_266", "field": "foreground_source", "human": "other_vocal (吸氣聲)", "gemini": "impact_explosion", "j1": "\"impact_explosion\"", "w1": "Gemini", "j2": "\"other_vocal (吸氣聲)\"", "w2": "人工", "status": "不一致"}, {"wid": "bourne_p2_266", "field": "music_role", "human": "none", "gemini": "score", "j1": "\"score\"", "w1": "Gemini", "j2": "\"none\"", "w2": "人工", "status": "不一致"}, {"wid": "bourne_p2_266", "field": "music_function", "human": "none", "gemini": "tension, transition", "j1": "\"tension, transition\"", "w1": "Gemini", "j2": "\"none\"", "w2": "人工", "status": "不一致"}, {"wid": "bourne_p2_266", "field": "social_intensity_0_3", "human": "3", "gemini": "2", "j1": "3", "w1": "人工", "j2": "2", "w2": "Gemini", "status": "不一致"}, {"wid": "bourne_p2_266", "field": "main_emotions", "human": "Jason Bourne: 害怕/緊繃", "gemini": "lead: tense", "j1": "\"Jason Bourne: 害怕/緊纋\"", "w1": "人工", "j2": "\"lead: tense\"", "w2": "Gemini", "status": "不一致"}, {"wid": "bourne_p4_91", "field": "social_intensity_0_3", "human": "1", "gemini": "2", "j1": "2", "w1": "Gemini", "j2": "1", "w2": "人工", "status": "不一致"}, {"wid": "bourne_p4_91", "field": "social_interaction", "human": "dialogue, other", "gemini": "dialogue", "j1": "[\"dialogue\", \"other\"]", "w1": "人工", "j2": "[\"dialogue\"]", "w2": "Gemini", "status": "不一致"}, {"wid": "wolf_p11_273", "field": "main_emotions", "human": "Leah Belfort: 平靜/自在; Jordan Belfort: 害怕/煩躁/平靜/困擾/放鬆", "gemini": "supporting: serious; lead: serious", "j1": "\"Leah Belfort: 平靜/自在; Jordan Belfort: 害怕/煩躁/平靜/困擾/放鬆\"", "w1": "人工", "j2": "\"supporting: serious; lead: serious\"", "w2": "Gemini", "status": "不一致"}, {"wid": "wolf_p2_301", "field": "location_change_type", "human": "none", "gemini": "same_scene_movement", "j1": "\"none\"", "w1": "人工", "j2": "\"same_scene_movement\"", "w2": "Gemini", "status": "不一致"}],S={};try{S=JSON.parse(localStorage.getItem('v53')||'{}')}catch(e){}
function save(){try{localStorage.setItem('v53',JSON.stringify(S))}catch(e){}}
function esc(s){var d=document.createElement('div');d.textContent=s;return d.innerHTML}
var L=document.getElementById('L');
D.forEach(function(r,i){var k=r.wid+'|'+r.field,c=document.createElement('div');c.className='c';
c.innerHTML='<b>'+esc(r.wid)+' · '+esc(r.field)+'</b><video controls preload="metadata" src="clips/'+r.wid+'.mp4"></video>'+
'<div class="h">人工：'+esc(r.human)+'</div><div class="g">Gemini：'+esc(r.gemini)+'</div>'+
'<div class="m">第 1 次評審 → '+r.w1+'；第 2 次評審 → '+r.w2+'</div>'+
'<div class="row"><b>我最後決定：</b><button data-v="人工">人工</button><button data-v="Gemini">Gemini</button><input placeholder="或自填答案"></div>';
var bs=c.querySelectorAll('button'),inp=c.querySelector('input');
function draw(){bs.forEach(function(b){b.setAttribute('aria-pressed',S[k]&&S[k].pick===b.dataset.v)});inp.value=(S[k]&&S[k].text)||''}
bs.forEach(function(b){b.onclick=function(){S[k]=S[k]||{};S[k].pick=b.dataset.v;save();draw()}});
inp.oninput=function(){S[k]=S[k]||{};S[k].text=inp.value;save()};draw();L.appendChild(c)});
document.getElementById('ex').onclick=function(){var t=JSON.stringify(S),o=document.getElementById('out');o.value=t;
navigator.clipboard.writeText(t).catch(function(){o.select()})};
</script></body></html>
